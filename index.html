<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Player de Música</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Overlay escuro para a Sidebar -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="container">
        <!-- SIDEBAR SLIDER -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fa-solid fa-compact-disc fa-spin"></i>
                    <span>Syu S</span>
                </div>
                <button class="close-sidebar-btn" id="close-sidebar-btn">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <ul class="nav-links">
                <li><a href="#" id="btn-inicio" class="active"><i class="fa-solid fa-house"></i> Início</a></li>
            </ul>

            <div class="playlists-section">
                <h3>Playlists de Artistas</h3>
                <ul id="artist-playlists">
                    <!-- Gerado dinamicamente -->
                </ul>
            </div>
        </aside>

        <!-- CONTEÚDO PRINCIPAL DINÂMICO -->
        <main class="main-content">
            <header class="header">
                <button class="menu-toggle-btn" id="menu-toggle-btn" aria-label="Abrir Menu">
                    <i class="fa-solid fa-bars"></i>
                    <span>Playlists</span>
                </button>

                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Pesquisar música ou artista...">
                </div>
            </header>

            <!-- AQUI É ONDE TUDO ACONTECE (DINÂMICO) -->
            <div id="content-view">
                <!-- O JavaScript vai preencher esta área com o layout dinâmico -->
            </div>
        </main>
    </div>

    <!-- REPRODUTOR DE ÁUDIO -->
    <div class="music-player">
        <div class="player-left">
            <img id="player-cover" src="https://picsum.photos/200" alt="Capa">
            <div class="player-song-info">
                <h4 id="player-title">A carregar...</h4>
                <p id="player-artist">A carregar...</p>
            </div>
        </div>

        <div class="player-center">
            <div class="player-controls">
                <button class="control-btn" id="prev-btn"><i class="fa-solid fa-backward-step"></i></button>
                <button class="control-btn play-btn" id="play-btn"><i class="fa-solid fa-circle-play"></i></button>
                <button class="control-btn" id="next-btn"><i class="fa-solid fa-forward-step"></i></button>
            </div>
            <div class="progress-container-box">
                <span id="current-time">0:00</span>
                <div class="progress-container" id="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <span id="total-duration">0:00</span>
            </div>
        </div>

        <div class="player-right">
            <div class="volume-container">
                <i class="fa-solid fa-volume-high"></i>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
            </div>
        </div>
    </div>

    <audio id="audio-player"></audio>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Spotify Clone</title>
    <!-- Ícones do FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Sidebar / Bottom Navigation em Mobile -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-brands fa-spotify"></i>
                <span>Spotify</span>
            </div>
            <nav class="nav-menu">
                <a href="#" id="btn-inicio" class="active">
                    <i class="fa-solid fa-house"></i> 
                    <span>Início</span>
                </a>
                <a href="#" id="btn-buscar">
                    <i class="fa-solid fa-magnifying-glass"></i> 
                    <span>Buscar</span>
                </a>
            </nav>
            <div class="playlists">
                <ul id="playlist-list">
                    <!-- Playlists inseridas via JS -->
                </ul>
            </div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <header class="topbar">
                <div class="nav-buttons">
                    <button class="btn-circle" id="btn-nav-back"><i class="fa-solid fa-chevron-left"></i></button>
                    <button class="btn-circle" id="btn-nav-forward"><i class="fa-solid fa-chevron-right"></i></button>
                </div>

                <!-- Barra de Pesquisa -->
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="O que você quer ouvir?">
                </div>

                <div class="user-menu">
                    <button class="btn-upgrade">Seja Premium</button>
                    <div class="profile-pic">
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>
            </header>

            <section class="content">
                <h2 id="section-title">Minhas Músicas</h2>
                <!-- Container principal da lista/grelha -->
                <div id="cards-container"></div>
            </section>
        </main>
    </div>

    <!-- Player Fixo no Rodapé -->
    <footer class="player">
        <div class="song-info">
            <img id="player-cover" src="https://picsum.photos/200" alt="Capa">
            <div class="song-text">
                <h4 id="player-title">Selecione uma música</h4>
                <p id="player-artist">Artista</p>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-buttons">
                <button id="prev-btn"><i class="fa-solid fa-backward-step"></i></button>
                <button id="play-btn" class="play-pause-btn"><i class="fa-solid fa-circle-play"></i></button>
                <button id="next-btn"><i class="fa-solid fa-forward-step"></i></button>
            </div>
            <div class="progress-bar-container">
                <span id="current-time">0:00</span>
                <div class="progress-bar" id="progress-container">
                    <div class="progress" id="progress-bar"></div>
                </div>
                <span id="total-duration">0:00</span>
            </div>
        </div>

        <div class="volume-controls">
            <i class="fa-solid fa-volume-high"></i>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.7">
        </div>
    </footer>

    <audio id="audio-player"></audio>
    <script src="script.js"></script>
</body>
</html>
